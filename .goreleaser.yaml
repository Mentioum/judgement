version: 2
project_name: judgement

builds:
  - id: judgement
    main: ./cmd/judgement
    binary: judgement
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/Mentioum/judgement/internal/cli.Version={{ .Version }}

archives:
  - id: binaries
    ids: [judgement]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      - docs/cli.md
      - docs/agents.md

checksum:
  name_template: checksums.txt

source:
  enabled: true
  name_template: "{{ .ProjectName }}_{{ .Version }}_source"
  format: tar.gz

# Generate these alongside the draft; publish only after the release is public.
aurs:
  - name: judgement-bin
    ids: [binaries]
    homepage: https://github.com/Mentioum/judgement
    description: Structured AI decisions for agents and scripts
    license: MIT
    skip_upload: true
    depends: [ca-certificates]
    provides: [judgement]
    conflicts: [judgement]
    package: |-
      install -Dm755 "./judgement" "${pkgdir}/usr/bin/judgement"
      install -Dm644 "./LICENSE" "${pkgdir}/usr/share/licenses/judgement-bin/LICENSE"
      install -Dm644 "./README.md" "${pkgdir}/usr/share/doc/judgement/README.md"

snapshot:
  version_template: "{{ .Version }}-SNAPSHOT-{{ .ShortCommit }}"

release:
  github:
    owner: Mentioum
    name: judgement
  draft: true
  prerelease: auto
  name_template: "Judgement {{ .Version }}"
