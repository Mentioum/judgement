name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - run: go test -race ./...
      - run: go vet ./...
      - name: Build and draft release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Attach package-manager files to the draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node packaging/prepare.mjs
          npm pack ./dist/packages/npm --pack-destination ./dist/packages --ignore-scripts
          (cd dist/packages && sha256sum *.tgz judgement.rb PKGBUILD .SRCINFO > package-checksums.txt)
          gh release upload "$RELEASE_TAG" dist/packages/*.tgz dist/packages/judgement.rb dist/packages/PKGBUILD dist/packages/.SRCINFO dist/packages/package-checksums.txt
