name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.23.x', stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Formatting
        shell: bash
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            exit 1
          fi
      - run: go vet ./...
      - run: go test -race -cover ./...
      - run: go build ./...
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: Check release configuration
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.2
          args: check
      - name: Package without publishing
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --snapshot --clean
      - name: Smoke-test packaged CLI
        shell: bash
        run: |
          (cd dist && sha256sum --check checksums.txt)
          mkdir -p "$RUNNER_TEMP/judgement-install"
          tar -xzf dist/judgement_*_linux_amd64.tar.gz -C "$RUNNER_TEMP/judgement-install"
          "$RUNNER_TEMP/judgement-install/judgement" version
          "$RUNNER_TEMP/judgement-install/judgement" validate --input examples/request.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Prepare package managers
        run: |
          node packaging/prepare.mjs
          npm pack ./dist/packages/npm --pack-destination ./dist/packages --ignore-scripts
          node packaging/test-npm.mjs dist/packages/*.tgz
          ruby -c dist/packages/judgement.rb
          bash -n dist/packages/PKGBUILD
      - name: Build and verify Arch package
        run: docker run --rm -v "$PWD:/workspace:ro" archlinux:base-devel bash /workspace/packaging/test-aur.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-install-tests
          path: |
            dist/packages/*.tgz
            dist/packages/judgement.rb
            dist/*_source.tar.gz
          retention-days: 3
  package-install:
    needs: packaging
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-install-tests
          path: dist
      - name: Install npm package and test CLI
        shell: bash
        run: node packaging/test-npm.mjs dist/packages/*.tgz
      - name: Install and test Homebrew formula
        if: runner.os == 'macOS'
        run: bash packaging/test-homebrew.sh
